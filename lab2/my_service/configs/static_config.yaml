components_manager:
  task_processors:
    main-task-processor:
      worker_threads: $worker-threads

    fs-task-processor:
      worker_threads: $worker-fs-threads

  coro_pool:
    stack_usage_monitor_enabled: false

  default_task_processor: main-task-processor
  components:
    server:
      listener:
        port: $server-port
        task_processor: main-task-processor

    postgres-db:
      dbconnection: "postgresql://medicine:secret@postgres:5432/medicine"
      blocking_task_processor: fs-task-processor
      dns_resolver: async

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: $logger-level
          overflow_behavior: discard

    dynamic-config:
      defaults:
        HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000

    testsuite-support: {}

    congestion-control:

    http-client:
    http-client-core:
      load-enabled: $is_testing
      fs-task-processor: fs-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    tests-control:
      load-enabled: $is_testing
      path: /tests/{action}
      method: POST
      task_processor: main-task-processor

    handler-ping:
      path: /ping
      method: GET
      task_processor: main-task-processor
      throttling_enabled: false
      url_trailing_slash: strict-match

    handler-health:
      path: /health
      method: GET
      task_processor: main-task-processor

    # ===== auth =====
    auth-config:
      jwt-secret: "CHANGE_ME_SUPER_SECRET"
      token-ttl-seconds: 3600

    handler-auth-register:
      path: /api/auth/register
      method: POST
      task_processor: main-task-processor

    handler-auth-login:
      path: /api/auth/login
      method: POST
      task_processor: main-task-processor

    # ===== CRUD =====
    handler-records-create:
      path: /api/records
      method: POST
      task_processor: main-task-processor

    handler-records-put:
      path: /api/records/{recordId}
      method: PUT
      task_processor: main-task-processor

    handler-records-patch:
      path: /api/records/{recordId}
      method: PATCH
      task_processor: main-task-processor

    handler-records-delete:
      path: /api/records/{recordId}
      method: DELETE
      task_processor: main-task-processor

    handler-records-list:
      path: /api/records
      method: GET
      task_processor: main-task-processor

    handler-patients-create:
      path: /api/patients
      method: POST
      task_processor: main-task-processor

    handler-patients-search:
      path: /api/patients/search
      method: GET
      task_processor: main-task-processor

    handler-patient-records-create:
      path: /api/patients/{patientId}/records
      method: POST
      task_processor: main-task-processor

    handler-patient-records-list:
      path: /api/patients/{patientId}/records
      method: GET
      task_processor: main-task-processor

    handler-records-get:
      path: /api/records/{recordId}
      method: GET
      task_processor: main-task-processor

    handler-users-get-by-login:
      path: /api/users/by-login
      method: GET
      task_processor: main-task-processor

    handler-users-search-by-name:
      path: /api/users/search
      method: GET
      task_processor: main-task-processor